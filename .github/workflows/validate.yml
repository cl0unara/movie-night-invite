name: Validate JavaScript

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check frontend and API syntax
        run: |
          node --check app.js
          node --check enhancements.js
          for file in api/*.js; do
            node --check "$file"
          done
      - name: Run API tests
        run: node --test tests/*.test.js
