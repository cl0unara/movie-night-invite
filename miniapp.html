<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#160d27">
  <title>Киноплан — наш вечер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#160d27;color:#fff}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#39204e,#160d27 65%);min-height:100vh;padding:24px 16px calc(36px + env(safe-area-inset-bottom))}
    main{max-width:620px;margin:auto}.eyebrow{color:#c6a5e7;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
    h1{font-size:32px;line-height:1.1;margin:8px 0}.intro{color:#d8cce4;line-height:1.5;margin:10px 0 24px}
    .status{font-size:13px;color:#c7b2d9;margin:0 0 18px}.section{font-size:18px;margin:24px 0 12px}
    .movie{background:#281939;border:1px solid #513967;border-radius:18px;padding:16px;margin:10px 0;display:flex;gap:12px;align-items:center}
    .movie strong{display:block;font-size:16px}.movie small{color:#bda9cf}.actions{margin-left:auto;display:flex;flex-direction:column;gap:7px}
    button{border:1px solid #76549a;background:#402657;color:#fff;border-radius:11px;padding:9px 11px;font-weight:600}
    button:disabled{opacity:.5}.guest{font-size:12px;color:#bda9cf}.empty{color:#cdbadd;padding:12px}
    .tag{font-size:11px;color:#e6d6f6;background:#53366b;padding:4px 7px;border-radius:20px;display:inline-block;margin-top:6px}
    #error{color:#ffb4bd;white-space:pre-wrap}
  </style>
</head>
<body>
<main>
  <div class="eyebrow">Кино на этот вечер</div>
  <h1>Наш киноплан 🎬</h1>
  <p class="intro">Выбираем, что посмотрим вместе. То, что уже посмотрели, останется в нашей истории.</p>
  <p class="status" id="status">Подключаем Telegram…</p>
  <p id="error"></p>
  <section><h2 class="section">В планах</h2><div id="catalog"></div></section>
  <section><h2 class="section">Уже смотрели ❤️</h2><div id="watched"></div></section>
  <section id="hidden-section" hidden><h2 class="section">Скрытые фильмы</h2><div id="hidden"></div></section>
</main>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const initData = tg && tg.initData;
  const status = document.querySelector('#status');
  const error = document.querySelector('#error');
  const catalog = document.querySelector('#catalog');
  const watched = document.querySelector('#watched');
  const hidden = document.querySelector('#hidden');
  const hiddenSection = document.querySelector('#hidden-section');
  let state = null;
  let role = 'guest';
  if (tg) { tg.ready(); tg.expand(); }
  const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function request(method, body) {
    const response = await fetch('/api/miniapp-state', {
      method, headers: {'content-type':'application/json','x-telegram-init-data':initData || ''},
      ...(body ? {body:JSON.stringify({...body,initData})} : {})
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Ошибка соединения');
    return data;
  }
  function card(movie, mode) {
    const admin = role === 'admin';
    let buttons = '';
    if (admin) {
      if (mode === 'catalog') buttons = '<button data-action="watched" data-value="true">В просмотренное</button><button data-action="hidden" data-value="true">Скрыть</button>';
      else if (mode === 'watched') buttons = '<button data-action="watched" data-value="false">Вернуть в планы</button>';
      else buttons = '<button data-action="hidden" data-value="false">Вернуть в каталог</button>';
    }
    return '<article class="movie"><div><strong>'+esc(movie.title)+'</strong><small>'+movie.year+'</small>'+(mode==='watched'?'<div class="tag">Уже посмотрели</div>':'')+'</div><div class="actions">'+buttons+'</div></article>';
  }
  function render() {
    const active = state.movies.filter(m => !m.hidden && !m.watched);
    const seen = state.movies.filter(m => m.watched && !m.hidden);
    const removed = state.movies.filter(m => m.hidden);
    catalog.innerHTML = active.map(m=>card(m,'catalog')).join('') || '<p class="empty">Пока пусто</p>';
    watched.innerHTML = seen.map(m=>card(m,'watched')).join('') || '<p class="empty">Здесь появятся просмотренные фильмы</p>';
    hiddenSection.hidden = role !== 'admin';
    hidden.innerHTML = removed.map(m=>card(m,'hidden')).join('') || '<p class="empty">Скрытых фильмов нет</p>';
    document.querySelectorAll('button[data-action]').forEach(button => {
      button.addEventListener('click', async () => {
        const movie = button.closest('.movie').querySelector('strong').textContent;
        const item = state.movies.find(m=>m.title===movie);
        if (!item) return;
        button.disabled = true;
        try { state = await request('POST',{id:item.id,action:button.dataset.action,value:button.dataset.value==='true'}); render(); }
        catch(e) { error.textContent=e.message; button.disabled=false; }
      });
    });
    status.textContent = role==='admin' ? 'Режим администратора · изменения видны обоим' : 'Гостевой доступ · общий список';
  }
  if (!initData) { status.textContent='Открой приложение через кнопку в Telegram-боте.'; error.textContent='Для проверки доступа нужен запуск внутри Telegram.'; return; }
  request('GET').then(data=>{state=data;role=data.role;render();}).catch(e=>{status.textContent='Не удалось подключиться';error.textContent=e.message;});
})();
</script>
</body>
</html>
